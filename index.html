<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网课课程表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   Schedule Dashboard — Neobrutalist Style
   ═══════════════════════════════════════════════════════════ */

:root {
  --bg:        #fafaf8;
  --panel:     #fff;
  --panel-alt: #f5f5f0;
  --dark:      #222;
  --darker:    #1a1a1a;
  --accent:    #3498db;
  --danger:    #e74c3c;
  --warning:   #f39c12;
  --success:   #27ae60;
  --text:      #111;
  --text-light:#555;
  --text-white:#eee;
  --border:    2px solid #111;
  --border-thick: 3px solid #111;
  --shadow:    4px 4px 0px rgba(0,0,0,0.8);
  --shadow-sm: 3px 3px 0px rgba(0,0,0,0.6);
  --grid-color: #e8e8e0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 14px; }

body {
  font-family: 'Roboto Mono', monospace;
  background: var(--bg);
  background-image:
    linear-gradient(var(--grid-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size: 20px 20px;
  background-position: -1px -1px;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #ccc; }
::-webkit-scrollbar-thumb { background: #555; }

/* ═══════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════ */

.app {
  min-height: 100vh;
}

.main {
  max-width: 1060px;
  margin: 0 auto;
  padding: 20px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ═══════════════════════════════════════════════════════════
   NOTIFICATION BANNER
   ═══════════════════════════════════════════════════════════ */

.notif-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: #fff3cd;
  border: var(--border);
  font-size: 11px;
}
.notif-banner.hidden { display: none; }

.btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px;
  border: var(--border);
  background: #e0e0e0; color: #000;
  font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 700;
  cursor: pointer;
  box-shadow: 2px 2px 0px #000;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-dark { background: #000; color: #fff; }

/* ═══════════════════════════════════════════════════════════
   HERO FRAME
   ═══════════════════════════════════════════════════════════ */

.hero-frame {
  background: var(--panel);
  border: var(--border-thick);
  box-shadow: var(--shadow);
}

.hero-frame .frame-header {
  background: #000; color: #fff;
  padding: 6px 12px; font-size: 11px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 2px solid #000;
}
.frame-header .dot { width: 8px; height: 8px; border-radius: 50%; background: #0f0; }
.frame-header .dot.warn { background: #f39c12; }
.frame-header .dot.danger { background: #e74c3c; animation: dot-blink 0.8s infinite; }

@keyframes dot-blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.hero-body {
  padding: 24px 28px;
  display: flex; align-items: center; gap: 28px;
  transition: background 0.5s;
}

/* State backgrounds */
.hero-body.calm        { background: #fff; }
.hero-body.approaching { background: #f6fafd; }
.hero-body.warning     { background: #fffdf7; }
.hero-body.urgent      { background: #fffafa; animation: urgent-bg 1s infinite; }
.hero-body.active      { background: #f9fdf9; }

@keyframes urgent-bg {
  0%,100% { background: #fffafa; }
  50%     { background: #fff0f0; }
}

/* Hero icon */
.hero-icon-block {
  width: 56px; height: 56px;
  border: var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
  transition: background 0.5s;
}
.hero-body.calm .hero-icon-block        { background: #f0f0fa; }
.hero-body.approaching .hero-icon-block { background: #f0f5fb; }
.hero-body.warning .hero-icon-block     { background: #fffdf0; }
.hero-body.urgent .hero-icon-block      { background: #fff5f5; }
.hero-body.active .hero-icon-block      { background: #f2fdf5; }

/* Hero info */
.hero-info { flex-shrink: 0; }
.hero-info .label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-light);
}
.hero-info .name {
  font-size: 26px; font-weight: 700;
  letter-spacing: -1px;
}
.hero-info .time {
  font-size: 12px; color: var(--text-light);
}
.hero-info .day {
  font-size: 11px; color: var(--text-light);
}

/* Hero countdown */
.hero-countdown-block {
  flex: 1; text-align: center;
}
.hero-countdown-block .cd-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-light);
  margin-bottom: 2px;
}
.hero-countdown-block .cd-value {
  font-size: 48px; font-weight: 700;
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

/* ── Hero vertical bar segments ── */

.hero-bars-wrap {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px;
}

.hero-bars {
  display: flex; gap: 3px;
  align-items: flex-end;
  height: 60px;
}

.hero-bar-seg {
  width: 10px;
  border: 2px solid #000;
  transition: background 0.8s ease, height 0.8s ease;
}
.hero-bar-seg.on  { background: #000; height: 100%; opacity: 0.63; }
.hero-bar-seg.off { background: #eee; height: 100%; }

/* Active state: green bars */
.hero-body.active .hero-bar-seg.on  { background: var(--success); border-color: #000; opacity: 0.63; }
.hero-body.active .hero-bar-seg.off { background: #eee; }

/* Urgent state: red bars */
.hero-body.urgent .hero-bar-seg.on  { background: var(--danger); border-color: #000; opacity: 0.63; }
.hero-body.urgent .hero-bar-seg.off { background: #f5eeee; }

/* Warning: amber bars */
.hero-body.warning .hero-bar-seg.on  { background: var(--warning); border-color: #000; opacity: 0.63; }
.hero-body.warning .hero-bar-seg.off { background: #f5f2e8; }

/* Approaching: cyan bars */
.hero-body.approaching .hero-bar-seg.on  { background: #2980b9; border-color: #000; opacity: 0.63; }
.hero-body.approaching .hero-bar-seg.off { background: #eaf0f5; }

/* Calm: black bars */
.hero-body.calm .hero-bar-seg.on  { background: #333; border-color: #000; opacity: 0.63; }
.hero-body.calm .hero-bar-seg.off { background: #eee; }

/* ── Dot matrix for class list ── */

.dot-matrix {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  flex-shrink: 0;
}

.dot-cell {
  width: 6px; height: 6px;
  border: 1px solid #000;
  transition: background 0.6s ease;
}
.dot-cell.on  { background: #000; opacity: 0.42; }
.dot-cell.off { background: #eee; }

.class-row.is-current .dot-cell.on  { background: var(--success); opacity: 0.42; }
.class-row.is-current .dot-cell.off { background: #e8f2e8; }
.class-row.is-next .dot-cell.on     { background: var(--accent); opacity: 0.42; }
.class-row.is-next .dot-cell.off    { background: #eaeef5; }

/* Hero status */
.hero-status-block {
  flex-shrink: 0; text-align: right;
}
.hero-status-tag {
  display: inline-block;
  padding: 6px 14px;
  border: var(--border);
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px;
  box-shadow: var(--shadow-sm);
}
.hero-body.calm .hero-status-tag        { background: #f0f0fa; }
.hero-body.approaching .hero-status-tag { background: #f0f5fb; }
.hero-body.warning .hero-status-tag     { background: #fffdf0; }
.hero-body.urgent .hero-status-tag      { background: #fff5f5; animation: tag-blink 0.8s infinite; }
.hero-body.active .hero-status-tag      { background: #f2fdf5; }

@keyframes tag-blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

.status-dot {
  display: inline-block; width: 8px; height: 8px;
  background: var(--success); margin-right: 6px;
}

/* ═══════════════════════════════════════════════════════════
   TWO-COLUMN GRID
   ═══════════════════════════════════════════════════════════ */

.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* ═══════════════════════════════════════════════════════════
   PANEL / FRAME
   ═══════════════════════════════════════════════════════════ */

.panel {
  background: var(--panel);
  border: var(--border-thick);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}

.panel-header {
  background: #000; color: #fff;
  padding: 6px 12px; font-size: 11px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 2px solid #000;
  font-weight: 700;
}

.panel-body {
  padding: 8px;
  flex: 1; overflow-y: auto;
  max-height: 420px;
}

/* ═══════════════════════════════════════════════════════════
   CLASS ROW
   ═══════════════════════════════════════════════════════════ */

.class-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border: 2px solid transparent;
  transition: background 0.1s, border-color 0.1s;
}
.class-row:hover { background: #fafaf7; }
.class-row + .class-row { margin-top: 4px; }

.class-row.is-current {
  background: #f4fdf6; border-color: var(--success);
}
.class-row.is-next {
  background: #f8f9fc; border-color: var(--accent);
}

.class-time-block {
  flex-shrink: 0; width: 90px; text-align: center;
}
.class-time-range {
  font-size: 12px; font-weight: 700;
}
.class-day-label {
  font-size: 10px; color: var(--text-light);
}

.class-info { flex: 1; min-width: 0; }
.class-name { font-size: 13px; font-weight: 700; }
.class-row.is-current .class-name { color: #1e8449; }

.class-status-tag {
  font-size: 9px; font-weight: 700;
  padding: 2px 6px; border: 1px solid #000;
  flex-shrink: 0;
}
.class-status-tag.ongoing { background: #f2fdf5; }
.class-status-tag.soon    { background: #fffdf0; }

.class-countdown {
  font-size: 11px; font-weight: 500;
  color: var(--text-light);
  flex-shrink: 0; min-width: 55px; text-align: right;
}

/* ═══════════════════════════════════════════════════════════
   HOMEWORK HERO CARD
   ═══════════════════════════════════════════════════════════ */

.hw-hero {
  padding: 14px;
  border: var(--border);
  margin-bottom: 10px;
  transition: background 0.3s, border-color 0.3s;
}
.hw-hero-calm    { background: #fafaff; border-color: #111; }
.hw-hero-warning { background: #fffef8; border-color: #f39c12; }
.hw-hero-urgent  { background: #fffafa; border-color: #e74c3c; animation: hw-pulse 1.5s infinite; }
.hw-hero-expired { background: #f8f8f8; border-color: #999; }

@keyframes hw-pulse {
  0%,100% { border-color: #e74c3c; }
  50%     { border-color: #c0392b; }
}

.hw-hero-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.hw-hero-label {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
}
.hw-hero-calm .hw-hero-label    { color: #2471a3; }
.hw-hero-warning .hw-hero-label { color: #b7950b; }
.hw-hero-urgent .hw-hero-label  { color: #c0392b; }
.hw-hero-expired .hw-hero-label { color: #888; }

.hw-hero-actions { display: flex; align-items: center; gap: 6px; }

.hw-hero-title   { font-size: 15px; font-weight: 700; margin-bottom: 0; }
.hw-hero-course  { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
.hw-hero-countdown { font-size: 20px; font-weight: 700; }
.hw-hero-calm .hw-hero-countdown    { color: #2471a3; }
.hw-hero-warning .hw-hero-countdown { color: #b7950b; }
.hw-hero-urgent .hw-hero-countdown  { color: #c0392b; }
.hw-hero-expired .hw-hero-countdown { color: #999; }

/* ═══════════════════════════════════════════════════════════
   HOMEWORK LIST
   ═══════════════════════════════════════════════════════════ */

.hw-section-title {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-light);
  padding: 4px 6px; margin-bottom: 4px;
}

.hw-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 10px;
  border: 2px solid transparent;
  transition: background 0.1s;
}
.hw-item:hover { background: #fafaf7; }
.hw-item + .hw-item { margin-top: 2px; }

.hw-item.completed { opacity: 0.45; }
.hw-item.completed .hw-item-title {
  text-decoration: line-through; color: #999;
}
.hw-item.priority-item {
  background: #fffef8; border-color: #f39c12;
}

/* Checkbox */
.hw-checkbox {
  appearance: none; -webkit-appearance: none;
  width: 16px; height: 16px;
  border: var(--border);
  cursor: pointer; flex-shrink: 0;
  position: relative;
  background: #fff;
}
.hw-checkbox:checked {
  background: var(--success); border-color: #000;
}
.hw-checkbox:checked::after {
  content: '';
  position: absolute; left: 3px; top: 1px;
  width: 5px; height: 8px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.hw-item-info { flex: 1; min-width: 0; }
.hw-item-title { font-size: 12px; font-weight: 500; }
.hw-item-meta  { font-size: 10px; color: var(--text-light); }

.hw-item-right {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}

.hw-item-countdown {
  font-size: 11px; color: var(--text-light);
  min-width: 55px; text-align: right;
}
.hw-item-countdown.urgent  { color: #c0392b; font-weight: 700; }
.hw-item-countdown.expired { color: #999; }

/* Star */
.star-btn {
  background: none; border: none;
  cursor: pointer; font-size: 16px;
  color: #ccc; line-height: 1; padding: 2px;
  transition: color 0.1s, transform 0.1s;
}
.star-btn:hover { color: #f39c12; transform: scale(1.2); }
.star-btn.active { color: #f39c12; }
.star-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

/* Empty */
.empty-msg {
  text-align: center; padding: 24px 16px;
  color: #999; font-size: 11px;
}
.empty-msg .empty-icon { font-size: 22px; display: block; margin-bottom: 6px; }

/* ═══════════════════════════════════════════════════════════
   BUFFER ZONE
   ═══════════════════════════════════════════════════════════ */

.buffer-section.hidden { display: none; }

.buffer-header {
  background: #000; color: #fff;
  padding: 6px 12px; font-size: 11px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 2px solid #000;
  font-weight: 700;
}

.buffer-body { padding: 8px; }

.buffer-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border: var(--border);
  background: #fffafa;
}
.buffer-item + .buffer-item { margin-top: 4px; }

.buffer-item-icon { font-size: 16px; flex-shrink: 0; }
.buffer-item-info { flex: 1; min-width: 0; }
.buffer-item-title { font-size: 12px; font-weight: 500; }
.buffer-item-meta  { font-size: 10px; color: var(--text-light); }

.buffer-expired-tag {
  font-size: 10px; font-weight: 700;
  padding: 2px 10px;
  border: var(--border);
  background: #fadbd8; color: #c0392b;
  flex-shrink: 0;
}

.buffer-clear-btn {
  padding: 4px 10px;
  border: var(--border);
  background: #fff;
  color: #c0392b;
  font-family: 'Roboto Mono', monospace; font-size: 10px; font-weight: 700;
  cursor: pointer;
  box-shadow: 2px 2px 0px #000;
  transition: transform 0.1s, box-shadow 0.1s;
}
.buffer-clear-btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 #000; }
.buffer-clear-btn:hover { background: #fdedec; }

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */

@media (max-width: 768px) {
  .main { padding: 12px; }
  .columns { grid-template-columns: 1fr; }
  .hero-body { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px 18px; }
  .hero-countdown-block .cd-value { font-size: 36px; }
  .hero-bars { height: 40px; }
  .hero-bar-seg { width: 7px; }
  .hero-bars-wrap { width: 100%; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ═══ Main ═══ -->
  <main class="main" id="mainContent">

    <!-- Hero Frame -->
    <div class="hero-frame" id="heroCard">
      <div class="frame-header">
        <span class="dot" id="heroDot"></span>
        <span id="heroFrameTitle">CURRENT STATUS</span>
      </div>
      <div class="hero-body calm" id="heroBody">
        <div class="hero-icon-block" id="heroIcon">📚</div>
        <div class="hero-info">
          <div class="label" id="heroLabel">NEXT CLASS</div>
          <div class="name" id="heroCourseName">--</div>
          <div class="time" id="heroTimeRange"></div>
          <div class="day" id="heroDay"></div>
        </div>
        <div class="hero-countdown-block">
          <div class="cd-label" id="heroCountdownLabel">COUNTDOWN</div>
          <div class="cd-value" id="heroCountdown">--</div>
        </div>
        <div class="hero-bars-wrap">
          <div class="hero-bars" id="heroBars"></div>
        </div>
        <div class="hero-status-block">
          <div class="hero-status-tag" id="heroStatusTag">IDLE</div>
        </div>
      </div>
    </div>

    <!-- Two Columns -->
    <div class="columns">

      <!-- Left: Upcoming -->
      <div class="panel" id="upcomingColumn">
        <div class="panel-header">
          <span>📅</span> UPCOMING CLASSES
        </div>
        <div class="panel-body" id="upcomingList">
          <div class="empty-msg"><span class="empty-icon">🎉</span>NO CLASSES</div>
        </div>
      </div>

      <!-- Right: Homework -->
      <div class="panel" id="homeworkColumn">
        <div class="panel-header">
          <span>📝</span> HOMEWORK
        </div>
        <div class="panel-body" id="homeworkBody">
          <div class="hw-hero hw-hero-calm hidden" id="hwHeroCard">
            <div class="hw-hero-top">
              <div class="hw-hero-label" id="hwHeroLabel">DEADLINE</div>
              <div class="hw-hero-actions">
                <button class="star-btn" id="hwHeroStar" title="PRIORITY" onclick="hwHeroTogglePriority()">☆</button>
                <input type="checkbox" class="hw-checkbox" id="hwHeroCheckbox" onchange="hwHeroToggleComplete()">
              </div>
            </div>
            <div class="hw-hero-title" id="hwHeroTitle"></div>
            <div class="hw-hero-course" id="hwHeroCourse"></div>
            <div class="hw-hero-countdown" id="hwHeroCountdown"></div>
          </div>

          <div class="hw-section-title" id="hwListTitle">ALL HOMEWORK</div>
          <div id="homeworkList">
            <div class="empty-msg"><span class="empty-icon">✅</span>NO HOMEWORK</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Buffer Zone -->
    <div class="panel buffer-section hidden" id="bufferSection">
      <div class="buffer-header">
        <span>🗑</span> EXPIRED & INCOMPLETE <span style="font-weight:400;font-size:10px;color:#999">(7 DAY RETENTION)</span>
      </div>
      <div class="buffer-body" id="bufferList"></div>
    </div>

    <!-- Notification Banner -->
    <div class="notif-banner hidden" id="notifBanner">
      <span>🔔</span>
      <span>ENABLE DESKTOP NOTIFICATIONS</span>
      <button class="btn btn-primary" onclick="requestNotificationPermission()">ENABLE</button>
    </div>

  </main>
</div>

<script>
/* ============================================================
   COURSE DATA
   ============================================================ */
const COURSES = [
  { id: 'english',   name: '英语',  days: [1, 3, 5], start: '10:00', end: '12:00' },
  { id: 'physics',   name: '物理',  days: [1, 3, 5], start: '19:15', end: '21:15' },
  { id: 'chinese',   name: '语文',  days: [2, 4, 6], start: '08:00', end: '10:00' },
  { id: 'chemistry', name: '化学',  days: [2, 4, 6], start: '17:10', end: '19:10' },
  { id: 'math1',     name: '数学1', days: [0],       start: '08:00', end: '10:00' },
  { id: 'math2',     name: '数学2', days: [0],       start: '19:15', end: '21:15' },
];

const DAY_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const DAY_NAMES_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

const HOMEWORK_DEADLINE_HOURS = 36;
const BUFFER_RETENTION_DAYS = 7;
const NOTIFY_MINUTES = [10, 5];

/* ============================================================
   UTILITY FUNCTIONS
   ============================================================ */

function parseTime(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return { h, m };
}

function timeToMinutes(timeStr) {
  const { h, m } = parseTime(timeStr);
  return h * 60 + m;
}

function makeClassDateTime(dayDate, timeStr) {
  const { h, m } = parseTime(timeStr);
  const d = new Date(dayDate);
  d.setHours(h, m, 0, 0);
  return d;
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function startOfDay(d) {
  const r = new Date(d);
  r.setHours(0, 0, 0, 0);
  return r;
}

function formatCountdown(ms) {
  if (ms <= 0) return '00:00';
  const totalSec = Math.floor(ms / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const minutes = Math.floor((totalSec % 3600) / 60);
  const seconds = totalSec % 60;
  const pad = (n) => String(n).padStart(2, '0');

  if (days > 0) return `${days}D ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  if (hours > 0) return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  return `${pad(minutes)}:${pad(seconds)}`;
}

function formatCountdownShort(ms) {
  if (ms <= 0) return 'ENDED';
  const totalSec = Math.floor(ms / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const minutes = Math.floor((totalSec % 3600) / 60);
  const pad = (n) => String(n).padStart(2, '0');

  if (days > 0) return `${days}D${pad(hours)}H`;
  if (hours > 0) return `${hours}H${pad(minutes)}M`;
  if (minutes > 0) return `${minutes}M`;
  return '<1M';
}

function formatTimeRange(start, end) {
  return `${start} — ${end}`;
}

/** Generate dot matrix HTML: total dots, ratio (0-1) of "on" dots */
function renderDotMatrix(total, ratio) {
  ratio = Math.max(0, Math.min(1, ratio));
  const onCount = Math.round(total * ratio);
  let html = '';
  for (let i = 0; i < total; i++) {
    html += `<div class="dot-cell ${i < onCount ? 'on' : 'off'}"></div>`;
  }
  return html;
}

/** Generate hero bar segments: 30 bars, ratio of "on" */
function renderHeroBars(container, ratio) {
  ratio = Math.max(0, Math.min(1, ratio));
  const total = 30;
  const onCount = Math.round(total * ratio);
  let html = '';
  for (let i = 0; i < total; i++) {
    html += `<div class="hero-bar-seg ${i < onCount ? 'on' : 'off'}"></div>`;
  }
  container.innerHTML = html;
}

/* ============================================================
   COURSE SCHEDULE LOGIC
   ============================================================ */

function getUpcomingClassInstances(now, maxDays) {
  const instances = [];
  const today = startOfDay(now);

  for (let offset = 0; offset < maxDays; offset++) {
    const checkDate = new Date(today);
    checkDate.setDate(checkDate.getDate() + offset);
    const dayOfWeek = checkDate.getDay();

    for (const course of COURSES) {
      if (!course.days.includes(dayOfWeek)) continue;

      const startDate = makeClassDateTime(checkDate, course.start);
      const endDate = makeClassDateTime(checkDate, course.end);

      if (endDate > now) {
        instances.push({ course, startDate, endDate });
      }
    }
  }

  instances.sort((a, b) => a.startDate - b.startDate);
  return instances;
}

function getImminentClass(now) {
  const today = startOfDay(now);
  const currentDay = now.getDay();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  let bestCourse = null;
  let bestStartDate = null;
  let bestEndDate = null;

  for (const course of COURSES) {
    if (!course.days.includes(currentDay)) continue;

    const startMin = timeToMinutes(course.start);
    const endMin = timeToMinutes(course.end);

    if (currentMinutes >= startMin && currentMinutes < endMin) {
      const startDate = makeClassDateTime(today, course.start);
      const endDate = makeClassDateTime(today, course.end);
      return { course, startDate, endDate, isOngoing: true };
    }

    if (currentMinutes < startMin) {
      const startDate = makeClassDateTime(today, course.start);
      if (!bestStartDate || startDate < bestStartDate) {
        bestCourse = course;
        bestStartDate = startDate;
        bestEndDate = makeClassDateTime(today, course.end);
      }
    }
  }

  if (bestCourse) {
    return { course: bestCourse, startDate: bestStartDate, endDate: bestEndDate, isOngoing: false };
  }

  const instances = getUpcomingClassInstances(now, 7);
  if (instances.length > 0) {
    const i = instances[0];
    return { course: i.course, startDate: i.startDate, endDate: i.endDate, isOngoing: false };
  }

  return null;
}

function getHeroState(msUntilStart, isOngoing, msUntilEnd) {
  if (isOngoing) return 'active';
  if (msUntilStart <= 0) return 'active';
  const minutes = msUntilStart / 60000;
  if (minutes < 10) return 'urgent';
  if (minutes <= 60) return 'warning';
  if (minutes <= 120) return 'approaching';
  return 'calm';
}

/* ============================================================
   HOMEWORK MANAGEMENT (localStorage)
   ============================================================ */

const STORAGE_KEY = 'schedule_homework';

function loadHomework() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) return [];
    return data;
  } catch (e) { return []; }
}

function saveHomework(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
}

function makeHomeworkId(courseId, classDate) {
  return `${courseId}-${dateKey(classDate)}`;
}

function findLastClassEnd(course, now) {
  const today = startOfDay(now);
  for (let offset = 0; offset < 9; offset++) {
    const checkDate = new Date(today);
    checkDate.setDate(checkDate.getDate() - offset);
    const dayOfWeek = checkDate.getDay();

    if (!course.days.includes(dayOfWeek)) continue;

    const endDate = makeClassDateTime(checkDate, course.end);
    if (endDate <= now) {
      return { classDate: checkDate, endDate };
    }
  }
  return null;
}

function autoGenerateHomework(now) {
  const homework = loadHomework();
  let changed = false;

  for (const course of COURSES) {
    const last = findLastClassEnd(course, now);
    if (!last) continue;

    const hoursSinceEnd = (now - last.endDate) / 3600000;
    if (hoursSinceEnd > HOMEWORK_DEADLINE_HOURS) continue;

    const hwId = makeHomeworkId(course.id, last.classDate);

    if (homework.some(h => h.id === hwId)) continue;

    const deadline = new Date(last.endDate.getTime() + HOMEWORK_DEADLINE_HOURS * 3600000);
    homework.push({
      id: hwId,
      courseName: course.name,
      classEndTime: last.endDate.toISOString(),
      deadline: deadline.toISOString(),
      title: `${course.name}作业`,
      completed: false,
      priority: false,
    });
    changed = true;
  }

  if (changed) { saveHomework(homework); }
}

function cleanupHomework(now) {
  let homework = loadHomework();
  let changed = false;

  homework = homework.filter(h => {
    const deadline = new Date(h.deadline);

    if (h.completed && deadline <= now) {
      changed = true;
      return false;
    }

    if (!h.completed && deadline <= now) {
      const daysSinceDeadline = (now - deadline) / 86400000;
      if (daysSinceDeadline > BUFFER_RETENTION_DAYS) {
        changed = true;
        return false;
      }
    }

    return true;
  });

  if (changed) { saveHomework(homework); }
}

function getActiveHomework(now) {
  const all = loadHomework();
  return all
    .filter(h => {
      const deadline = new Date(h.deadline);
      return !h.completed && deadline > now;
    })
    .sort((a, b) => {
      if (a.priority && !b.priority) return -1;
      if (!a.priority && b.priority) return 1;
      return new Date(a.deadline) - new Date(b.deadline);
    });
}

function getCompletedHomework(now) {
  const all = loadHomework();
  return all.filter(h => {
    const deadline = new Date(h.deadline);
    return h.completed && deadline > now;
  }).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
}

function getExpiredIncompleteHomework(now) {
  const all = loadHomework();
  return all.filter(h => {
    const deadline = new Date(h.deadline);
    return !h.completed && deadline <= now;
  }).sort((a, b) => new Date(b.deadline) - new Date(a.deadline));
}

function toggleHomeworkComplete(hwId) {
  const homework = loadHomework();
  const hw = homework.find(h => h.id === hwId);
  if (hw) { hw.completed = !hw.completed; saveHomework(homework); }
}

function toggleHomeworkPriority(hwId) {
  const homework = loadHomework();
  const hw = homework.find(h => h.id === hwId);
  if (hw) { hw.priority = !hw.priority; saveHomework(homework); }
}

function clearHomeworkFromBuffer(hwId) {
  let homework = loadHomework();
  homework = homework.filter(h => h.id !== hwId);
  saveHomework(homework);
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
let sentNotifications = new Set();
let notificationPermission = 'default';

function requestNotificationPermission() {
  if (!('Notification' in window)) {
    document.getElementById('notifBanner').classList.add('hidden');
    return;
  }

  Notification.requestPermission().then(perm => {
    notificationPermission = perm;
    if (perm === 'granted') {
      document.getElementById('notifBanner').classList.add('hidden');
    } else if (perm === 'default') {
      document.getElementById('notifBanner').classList.remove('hidden');
    } else {
      document.getElementById('notifBanner').classList.add('hidden');
    }
  });
}

function checkAndSendNotifications(now) {
  if (!('Notification' in window)) return;
  if (notificationPermission !== 'granted') return;

  const instances = getUpcomingClassInstances(now, 2);

  for (const inst of instances) {
    const msUntilStart = inst.startDate - now;
    const minutesUntil = Math.floor(msUntilStart / 60000);

    for (const threshold of NOTIFY_MINUTES) {
      if (minutesUntil === threshold) {
        const notifKey = `${inst.course.id}-${dateKey(inst.startDate)}-${threshold}`;
        if (!sentNotifications.has(notifKey)) {
          sentNotifications.add(notifKey);
          try {
            new Notification(`${inst.course.name} 即将开始`, {
              body: `将在 ${threshold} 分钟后开始上课\n${formatTimeRange(inst.course.start, inst.course.end)}`,
              tag: notifKey,
            });
          } catch (e) {}
        }
      }
    }
  }
}

/* ============================================================
   RENDERING
   ============================================================ */

function renderHero(now) {
  const imminent = getImminentClass(now);

  const heroBody = document.getElementById('heroBody');
  const heroDot = document.getElementById('heroDot');
  const heroFrameTitle = document.getElementById('heroFrameTitle');
  const label = document.getElementById('heroLabel');
  const courseName = document.getElementById('heroCourseName');
  const timeRange = document.getElementById('heroTimeRange');
  const countdown = document.getElementById('heroCountdown');
  const countdownLabel = document.getElementById('heroCountdownLabel');
  const statusTag = document.getElementById('heroStatusTag');
  const day = document.getElementById('heroDay');

  heroBody.className = 'hero-body';
  heroDot.className = 'dot';

  if (!imminent) {
    heroFrameTitle.textContent = 'CURRENT STATUS';
    label.textContent = 'IDLE';
    courseName.textContent = 'NO CLASSES';
    timeRange.textContent = '';
    countdown.textContent = '--:--';
    countdownLabel.textContent = 'FREE';
    statusTag.textContent = 'IDLE';
    day.textContent = '';
    heroBody.classList.add('calm');
    return;
  }

  const { course, startDate, endDate, isOngoing } = imminent;
  const msUntilStart = startDate - now;
  const msUntilEnd = endDate - now;
  const state = getHeroState(msUntilStart, isOngoing, msUntilEnd);

  heroBody.classList.add(state);

  // Dot
  if (isOngoing) { heroDot.classList.add('warn'); heroFrameTitle.textContent = 'CLASS IN PROGRESS'; }
  else if (state === 'urgent') { heroDot.classList.add('danger'); heroFrameTitle.textContent = 'STARTING SOON'; }
  else { heroFrameTitle.textContent = 'CURRENT STATUS'; }

  // Info
  courseName.textContent = course.name;
  timeRange.textContent = formatTimeRange(course.start, course.end);

  const classDayOfWeek = startDate.getDay();
  const today = now.getDay();
  if (classDayOfWeek === today) {
    day.textContent = 'TODAY';
  } else {
    const daysDiff = Math.floor((startOfDay(startDate) - startOfDay(now)) / 86400000);
    if (daysDiff === 1) day.textContent = 'TOMORROW';
    else day.textContent = DAY_NAMES_EN[classDayOfWeek] + ' ' + DAY_NAMES[classDayOfWeek];
  }

  // Countdown & Status
  if (isOngoing) {
    label.textContent = 'IN PROGRESS';
    countdownLabel.textContent = 'TIME REMAINING';
    countdown.textContent = formatCountdown(msUntilEnd);
    statusTag.innerHTML = '<span class="status-dot"></span>LIVE';
  } else if (state === 'urgent') {
    label.textContent = 'STARTING SOON';
    countdownLabel.textContent = 'COUNTDOWN';
    countdown.textContent = formatCountdown(msUntilStart);
    statusTag.textContent = '⚠ STARTING';
  } else {
    label.textContent = 'NEXT CLASS';
    countdownLabel.textContent = 'COUNTDOWN';
    countdown.textContent = formatCountdown(msUntilStart);
    statusTag.textContent = 'WAITING';
  }

  // Render hero bar visualization
  const barsContainer = document.getElementById('heroBars');
  let barRatio = 0;
  if (imminent) {
    if (imminent.isOngoing) {
      const totalDuration = imminent.endDate - imminent.startDate;
      barRatio = Math.max(0, msUntilEnd) / totalDuration;
    } else {
      barRatio = Math.min(1, Math.max(0, msUntilStart) / (2 * 3600000)); // 2h reference window
    }
  }
  renderHeroBars(barsContainer, barRatio);
}

function renderUpcomingList(now) {
  const container = document.getElementById('upcomingList');
  const instances = getUpcomingClassInstances(now, 7).slice(0, 6);

  if (instances.length === 0) {
    container.innerHTML = '<div class="empty-msg"><span class="empty-icon">🎉</span>NO CLASSES</div>';
    return;
  }

  let html = '';
  for (const inst of instances) {
    const msUntilStart = inst.startDate - now;
    const msUntilEnd = inst.endDate - now;
    const isOngoing = msUntilStart <= 0 && msUntilEnd > 0;
    const isNext = !isOngoing && inst === instances[0];

    let itemClass = 'class-row';
    if (isOngoing) itemClass += ' is-current';
    else if (isNext && msUntilStart > 0) itemClass += ' is-next';

    let statusHtml = '';
    if (isOngoing) {
      statusHtml = '<span class="class-status-tag ongoing">LIVE</span>';
    } else if (msUntilStart > 0 && msUntilStart < 600000) {
      statusHtml = '<span class="class-status-tag soon">SOON</span>';
    }

    const classDay = inst.startDate.getDay();
    const daysDiff = Math.floor((startOfDay(inst.startDate) - startOfDay(now)) / 86400000);
    let dayLabel;
    if (daysDiff === 0) dayLabel = 'TODAY';
    else if (daysDiff === 1) dayLabel = 'TOMORROW';
    else dayLabel = DAY_NAMES_EN[classDay];

    html += `
      <div class="${itemClass}">
        <div class="class-time-block">
          <div class="class-time-range">${formatTimeRange(inst.course.start, inst.course.end)}</div>
          <div class="class-day-label">${dayLabel}</div>
        </div>
        <div class="class-info">
          <div class="class-name">${inst.course.name}</div>
        </div>
        ${statusHtml}
        <div class="class-countdown">${isOngoing ? 'R ' + formatCountdownShort(msUntilEnd) : formatCountdownShort(msUntilStart)}</div>
        <div class="dot-matrix">${renderDotMatrix(15, isOngoing ? msUntilEnd / (inst.endDate - inst.startDate) : msUntilStart / (2 * 3600000))}</div>
      </div>`;
  }

  container.innerHTML = html;
}

function renderHomeworkList(now) {
  const activeHw = getActiveHomework(now);
  const completedHw = getCompletedHomework(now);
  const nearestHw = activeHw.length > 0 ? activeHw[0] : null;
  const otherActive = activeHw.length > 1 ? activeHw.slice(1) : [];

  const hwHero = document.getElementById('hwHeroCard');
  const hwHeroLabel = document.getElementById('hwHeroLabel');
  const hwHeroTitle = document.getElementById('hwHeroTitle');
  const hwHeroCourse = document.getElementById('hwHeroCourse');
  const hwHeroCountdown = document.getElementById('hwHeroCountdown');
  const hwHeroStar = document.getElementById('hwHeroStar');
  const hwHeroCheckbox = document.getElementById('hwHeroCheckbox');

  if (nearestHw) {
    hwHero.classList.remove('hidden');
    hwHeroTitle.textContent = nearestHw.title;
    hwHeroCourse.textContent = nearestHw.courseName;
    hwHeroStar.classList.toggle('active', nearestHw.priority);
    hwHeroStar.dataset.hwId = nearestHw.id;
    hwHeroCheckbox.checked = nearestHw.completed;
    hwHeroCheckbox.dataset.hwId = nearestHw.id;

    const msUntilDeadline = new Date(nearestHw.deadline) - now;
    hwHeroCountdown.textContent = msUntilDeadline > 0 ? 'REMAIN ' + formatCountdown(msUntilDeadline) : 'EXPIRED';

    hwHero.className = 'hw-hero';
    const hoursLeft = msUntilDeadline / 3600000;
    if (msUntilDeadline <= 0) {
      hwHero.classList.add('hw-hero-expired');
      hwHeroLabel.textContent = 'EXPIRED';
    } else if (hoursLeft < 2) {
      hwHero.classList.add('hw-hero-urgent');
      hwHeroLabel.textContent = 'URGENT';
    } else if (hoursLeft < 12) {
      hwHero.classList.add('hw-hero-warning');
      hwHeroLabel.textContent = 'DUE SOON';
    } else {
      hwHero.classList.add('hw-hero-calm');
      hwHeroLabel.textContent = 'DEADLINE';
    }
  } else {
    hwHero.classList.add('hidden');
  }

  const listTitle = document.getElementById('hwListTitle');
  listTitle.style.display = (otherActive.length + completedHw.length > 0) ? '' : 'none';

  const container = document.getElementById('homeworkList');

  if (otherActive.length === 0 && completedHw.length === 0) {
    container.innerHTML = '<div class="empty-msg"><span class="empty-icon">✅</span>NO HOMEWORK</div>';
    return;
  }

  let html = '';

  for (const hw of otherActive) {
    const msUntilDeadline = new Date(hw.deadline) - now;
    const hoursLeft = msUntilDeadline / 3600000;
    let countdownClass = '';
    let countdownText;

    if (msUntilDeadline <= 0) {
      countdownText = 'EXPIRED';
      countdownClass = 'expired';
    } else if (hoursLeft < 2) {
      countdownText = formatCountdown(msUntilDeadline);
      countdownClass = 'urgent';
    } else {
      countdownText = formatCountdownShort(msUntilDeadline);
    }

    html += `
      <div class="hw-item ${hw.priority ? 'priority-item' : ''}" data-hw-id="${hw.id}">
        <input type="checkbox" class="hw-checkbox" ${hw.completed ? 'checked' : ''}
          onchange="handleCheckbox(this, '${hw.id}')">
        <div class="hw-item-info">
          <div class="hw-item-title">${hw.title}</div>
          <div class="hw-item-meta">${hw.courseName}</div>
        </div>
        <div class="hw-item-right">
          <div class="hw-item-countdown ${countdownClass}">${countdownText}</div>
          <button class="star-btn ${hw.priority ? 'active' : ''}"
            onclick="handlePriority('${hw.id}')" title="${hw.priority ? '取消优先' : '设为优先'}">
            ${hw.priority ? '★' : '☆'}
          </button>
        </div>
      </div>`;
  }

  for (const hw of completedHw) {
    const msUntilDeadline = new Date(hw.deadline) - now;
    html += `
      <div class="hw-item completed" data-hw-id="${hw.id}">
        <input type="checkbox" class="hw-checkbox" checked
          onchange="handleCheckbox(this, '${hw.id}')">
        <div class="hw-item-info">
          <div class="hw-item-title">${hw.title}</div>
          <div class="hw-item-meta">${hw.courseName} · DONE</div>
        </div>
        <div class="hw-item-right">
          <div class="hw-item-countdown">${msUntilDeadline > 0 ? formatCountdownShort(msUntilDeadline) : 'CLEAR'}</div>
          <button class="star-btn" disabled>☆</button>
        </div>
      </div>`;
  }

  container.innerHTML = html;
}

function renderBufferZone(now) {
  const section = document.getElementById('bufferSection');
  const container = document.getElementById('bufferList');
  const expiredHw = getExpiredIncompleteHomework(now);

  if (expiredHw.length === 0) {
    section.classList.add('hidden');
    return;
  }

  section.classList.remove('hidden');

  let html = '';
  for (const hw of expiredHw) {
    const deadline = new Date(hw.deadline);
    const hoursSinceDeadline = Math.floor((now - deadline) / 3600000);
    let expiredText;
    if (hoursSinceDeadline < 1) expiredText = 'JUST NOW';
    else if (hoursSinceDeadline < 24) expiredText = `+${hoursSinceDeadline}H`;
    else { const d = Math.floor(hoursSinceDeadline / 24); expiredText = `+${d}D`; }

    html += `
      <div class="buffer-item">
        <span class="buffer-item-icon">⚠</span>
        <div class="buffer-item-info">
          <div class="buffer-item-title">${hw.title}</div>
          <div class="buffer-item-meta">${hw.courseName} · DUE ${new Date(hw.deadline).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <span class="buffer-expired-tag">${expiredText}</span>
        <button class="buffer-clear-btn" onclick="handleBufferClear('${hw.id}')">CLEAR</button>
      </div>`;
  }

  container.innerHTML = html;
}

function renderAll() {
  const now = new Date();

  autoGenerateHomework(now);
  cleanupHomework(now);

  renderHero(now);
  renderUpcomingList(now);
  renderHomeworkList(now);
  renderBufferZone(now);

  checkAndSendNotifications(now);
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */

function handleCheckbox(checkbox, hwId) {
  toggleHomeworkComplete(hwId);
  renderAll();
}

function handlePriority(hwId) {
  toggleHomeworkPriority(hwId);
  renderAll();
}

function handleBufferClear(hwId) {
  clearHomeworkFromBuffer(hwId);
  renderAll();
}

function hwHeroTogglePriority() {
  const starBtn = document.getElementById('hwHeroStar');
  const hwId = starBtn.dataset.hwId;
  if (hwId) { toggleHomeworkPriority(hwId); renderAll(); }
}

function hwHeroToggleComplete() {
  const checkbox = document.getElementById('hwHeroCheckbox');
  const hwId = checkbox.dataset.hwId;
  if (hwId) { toggleHomeworkComplete(hwId); renderAll(); }
}

/* ============================================================
   INITIALIZATION
   ============================================================ */

if ('Notification' in window) {
  notificationPermission = Notification.permission;
  if (notificationPermission === 'default') {
    document.getElementById('notifBanner').classList.remove('hidden');
  }
}

renderAll();
setInterval(renderAll, 1000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { renderAll(); }
});
</script>
